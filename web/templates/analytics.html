{{ define "content" }}
<div class="max-w-8xl mx-auto p-6">
  <div class="bg-gray-200 dark:bg-slate-800 rounded-2xl shadow-md p-5 mb-6 flex flex-wrap justify-center gap-6 items-end">
    
    <div class="flex flex-col items-center">
      <label class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Time range (minutes)</label>
      <input 
        id="range" 
        type="number" 
        value="60" 
        min="1" 
        class="w-36 px-3 py-2 rounded-lg border border-gray-300 dark:border-slate-700 dark:bg-slate-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
      />
    </div>

    <div class="flex flex-col items-center">
      <label class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Host</label>
      <select 
        id="host" 
        class="w-64 px-3 py-2 rounded-lg border border-gray-300 dark:border-slate-700 dark:bg-slate-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
      >
        <option value="">All</option>
      </select>
    </div>

    <div class="flex flex-col items-center">
      <label class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">IP filter</label>
      <select 
        id="ipFilter" 
        class="w-48 px-3 py-2 rounded-lg border border-gray-300 dark:border-slate-700 dark:bg-slate-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
      >
        <option value="">All</option>
        <option value="genuine">Genuine</option>
        <option value="suspicious">Suspicious</option>
        <option value="unknown">Unknown</option>
      </select>
    </div>

    <div class="flex flex-col items-center">
      <button 
        id="applyBtn" 
        class="px-5 py-2 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 shadow-md transition"
      >
        Apply
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="rounded-xl shadow p-4 bg-gray-200 dark:bg-slate-800">
      <h2 class="font-semibold mb-2">Requests over time</h2>
      <div id="requestsChart" class="h-72"></div>
    </div>

    <div class="rounded-xl shadow p-4 bg-gray-200 dark:bg-slate-800">
      <h2 class="font-semibold mb-2">Status codes</h2>
      <div id="statusChart" class="h-72"></div>
    </div>

    <div class="rounded-xl shadow p-4 bg-gray-200 dark:bg-slate-800">
      <h2 class="font-semibold mb-2">Top URIs</h2>
      <div id="uriChart" class="h-72"></div>
    </div>

    <div class="rounded-xl shadow p-4 bg-gray-200 dark:bg-slate-800">
      <h2 class="font-semibold mb-2">Average request time</h2>
      <div id="latencyChart" class="h-72"></div>
    </div>
  </div>

  <div class="mt-8 rounded-xl shadow p-4 bg-gray-200 dark:bg-slate-800">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold">IP Reputation</h2>
      <span class="text-xs text-gray-500 dark:text-gray-400">Unique IPs based on recent traffic</span>
    </div>
    <div id="ipList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
  </div>

  <div class="mt-8 rounded-xl shadow p-4 bg-gray-200 dark:bg-slate-800">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold">IP Locations</h2>
      <span class="text-xs text-gray-500 dark:text-gray-400">Geo lookup cached to avoid rate limits</span>
    </div>
    <div id="ipMap" class="h-96 rounded-xl overflow-hidden"></div>
  </div>
</div>

<link rel="stylesheet" href="{{ setting "cdn.leaflet_css" }}">
<script src="{{ setting "cdn.echarts" }}"></script>
<script src="{{ setting "cdn.leaflet_js" }}"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {
  const requestsChart = echarts.init(document.getElementById('requestsChart'));
  const statusChart   = echarts.init(document.getElementById('statusChart'));
  const uriChart      = echarts.init(document.getElementById('uriChart'));
  const latencyChart  = echarts.init(document.getElementById('latencyChart'));

  const hostSelect = document.getElementById('host');
  const rangeInput = document.getElementById('range');
  const applyBtn   = document.getElementById('applyBtn');
  const ipFilter   = document.getElementById('ipFilter');
  const mapEl      = document.getElementById('ipMap');

  const map = L.map(mapEl, { scrollWheelZoom: false }).setView([20, 0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  const markerLayer = L.layerGroup().addTo(map);

  async function loadHosts() {
    try {
      const res = await fetch('/api/analytics/hosts');
      const hosts = await res.json();
      hosts.forEach(h => {
        const opt = document.createElement('option');
        opt.value = h;
        opt.textContent = h;
        hostSelect.appendChild(opt);
      });
    } catch (err) {
      console.error('Failed to load hosts:', err);
    }
  }

    async function fetchCharts() {
        const range = rangeInput.value;
        const host  = hostSelect.value;
        try {
        const res = await fetch(`/api/analytics?range=${range}&host=${encodeURIComponent(host)}`);
        const data = await res.json();
        renderRequests(data.requests_over_time);
        renderStatus(data.status_codes);
        renderUris(data.top_uris);
        renderLatency(data.avg_request_time);
        } catch (err) {
        console.error('Failed to fetch analytics:', err);
        }
    }

    async function fetchData() {
        const range = rangeInput.value;
        const host  = hostSelect.value;
        const filter = ipFilter.value;
        await fetchCharts();
        await fetchIPs(range, host, filter);
        await fetchGeo(range, host);
    }


  function renderRequests(d) {
    requestsChart.setOption({
      tooltip: { trigger: 'axis' },
      xAxis: { type: 'category', data: d.labels },
      yAxis: { type: 'value' },
      series: [{ type: 'line', smooth: true, data: d.values }]
    });
  }

  function renderStatus(d) {
    statusChart.setOption({
      tooltip: { trigger: 'item' },
      xAxis: { type: 'category', data: Object.keys(d) },
      yAxis: { type: 'value' },
      series: [{ type: 'bar', data: Object.values(d) }]
    });
  }

  function renderUris(d) {
      if (!d || !d.status_codes || !d.labels || d.labels.length === 0) return;

      const codes = Object.keys(d.status_codes).filter(code =>
          d.status_codes[code].some(v => v > 0) 
      );

      const series = codes.map(code => ({
          name: code,
          type: 'bar',
          stack: 'status',
          label: { show: false },
          data: d.status_codes[code]
      }));

      uriChart.setOption({
          tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
          legend: { data: codes, 
            textStyle:{
              color:'white'
            },
          },
          grid: { left: '20%', right: '5%', bottom: '10%' },
          xAxis: { type: 'value' },
          yAxis: {
              type: 'category',
              axisLabel: {
                  rotate: 0,
                  align: 'right', 
                  fontSize: 12
              },
              data: d.labels
          },
          series
      });
  }

  function renderLatency(d) {
    latencyChart.setOption({
      tooltip: { trigger: 'axis' },
      xAxis: { type: 'category', data: d.labels },
      yAxis: { type: 'value' },
      series: [{ type: 'line', smooth: true, data: d.values }]
    });
  }

  async function fetchIPs(range, host, filter) {
    const list = document.getElementById('ipList');
    list.innerHTML = '';
    try {
      const res = await fetch(`/api/analytics/ips?range=${range}&host=${encodeURIComponent(host)}&filter=${encodeURIComponent(filter)}`);
      const ips = await res.json();
      if (!Array.isArray(ips) || ips.length === 0) {
        list.innerHTML = '<div class="text-sm text-gray-500 dark:text-gray-400">No IPs found for this filter.</div>';
        return;
      }
      ips.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-900 rounded-xl p-4 shadow flex items-center justify-between';
        const badgeClass = entry.verdict === 'suspicious'
          ? 'bg-red-100 text-red-700 dark:bg-red-500/10 dark:text-red-400'
          : entry.verdict === 'genuine'
            ? 'bg-green-100 text-green-700 dark:bg-green-500/10 dark:text-green-400'
            : 'bg-gray-200 text-gray-700 dark:bg-slate-700 dark:text-gray-300';
        card.innerHTML = `
          <div>
            <div class="text-sm font-semibold">${entry.ip}</div>
            <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">
              Score: ${entry.score ?? 0} · Reports: ${entry.reports ?? 0}
            </div>
            <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">
              Host: ${Array.isArray(entry.hostnames) && entry.hostnames.length > 0 ? entry.hostnames.join(', ') : '—'}
            </div>
            <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">
              ISP: ${entry.isp ? entry.isp : '—'}
            </div>
          </div>
          <span class="px-3 py-1 text-xs font-semibold rounded-full ${badgeClass}">
            ${entry.verdict || 'unknown'}
          </span>
        `;
        list.appendChild(card);
      });
    } catch (err) {
      console.error('Failed to load IP reputation:', err);
      list.innerHTML = '<div class="text-sm text-gray-500 dark:text-gray-400">Failed to load IP reputation.</div>';
    }
  }

  async function fetchGeo(range, host) {
    markerLayer.clearLayers();
    try {
      const res = await fetch(`/api/analytics/ip-geo?range=${range}&host=${encodeURIComponent(host)}`);
      const points = await res.json();
      if (!Array.isArray(points) || points.length === 0) {
        return;
      }
      const bounds = [];
      points.forEach(p => {
        if (typeof p.lat !== 'number' || typeof p.lon !== 'number') return;
        const marker = L.marker([p.lat, p.lon]);
        const label = `${p.ip}${p.city || p.region || p.country ? ' — ' + [p.city, p.region, p.country].filter(Boolean).join(', ') : ''}`;
        marker.bindPopup(label);
        marker.addTo(markerLayer);
        bounds.push([p.lat, p.lon]);
      });
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [24, 24] });
      }
    } catch (err) {
      console.error('Failed to load IP geo:', err);
    }
  }

  applyBtn.addEventListener('click', fetchData);
  ipFilter.addEventListener('change', fetchData);

  await loadHosts();
  fetchData();

  // Auto-refresh charts every 5s (IP reputation only refreshes on Apply/filter change)
  setInterval(fetchCharts, 5000);
});
</script>
{{ end }}

{{ define "content" }}

<div
  x-data="{
    open: false,
    mode: 'create', // 'create' | 'edit'
    record: {
      id: null,
      name: '',
      type: 'A',
      content: '',
      ttl: 3600
    }
  }"
  x-cloak
>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6">
        <div>
            <h3 class="text-xl font-semibold">Records</h3>
            <p class="text-sm text-gray-500">
            Manage DNS records
            </p>
        </div>
        <div class="mt-4 sm:mt-0 flex gap-3">
            <button
                @click="
                    mode = 'create';
                    open = true;
                    record = { id: null, name: '', type: 'A', content: '', ttl: 3600 };
                "
                class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg"
                >
                + New Record
            </button>
        </div>
    </div>

        {{ $items := .Data }}

        <!-- <div class="bg-white rounded-2xl shadow-md overflow-hidden"> -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-md overflow-hidden">

            <table class="w-full text-sm">
                <thead class="bg-gray-50 dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700">
                    <tr class="text-left text-gray-500 dark:text-gray-400">
                        <th class="px-6 py-3 font-medium">ID</th>
                        <th class="px-6 py-3 font-medium">Name</th>
                        <th class="px-6 py-3 font-medium">Type</th>
                        <th class="px-6 py-4 font-medium">Content</th>
                        <th class="px-6 py-4 font-medium">TTL</th>
                        <th class="px-6 py-4 font-medium text-center">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 dark:divide-slate-700">
                    {{ range $items }}
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-800 transition">
                        <td class="px-6 py-4 text-gray-400">{{ .ID }}</td>
                        <td class="px-6 py-4 font-medium">{{ .Name }}</td>
                        <td class="px-6 py-4 font-medium">{{ .Type }}</td>
                        <td class="px-6 py-4 font-medium
                                {{if eq .Type "TXT"}}whitespace-normal break-words max-w-[400px]{{else}}whitespace-nowrap{{end}}">
                            {{.Content}}
                        </td>
                        <td class="px-6 py-4 font-medium">{{ .Ttl }}</td>
                        <td class="px-6 py-4 text-center whitespace-nowrap">
                            <div class="flex gap-4 justify-center">
                            <button
                            @click="
                                mode = 'edit';
                                open = true;
                                const r = {{ . | json }};
                                record.id = r.ID;
                                record.name = r.Name;
                                record.type = r.Type;
                                record.content = r.Content;
                                record.ttl = r.Ttl;
                            "
                            class="text-blue-600 hover:underline"
                            >
                            Edit
                            </button>

                                <form method="POST" action="/records/{{.ID}}/delete"
                                        onsubmit="return confirm('Delete Record?')">
                                    <button class="text-red-600 hover:underline">Delete</button>
                                </form>
                            </div>
                        </td> 
                    </tr>
                    {{end}}
                </tbody>
            </table>
            <div
                x-show="open"
                x-transition
                class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50"
                >
                <div class="bg-white dark:bg-slate-900 rounded-xl shadow-xl w-96 p-8 relative">

                    <button
                    @click="open = false"
                    class="absolute top-3 right-3 text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 text-xl"
                    >
                    &times;
                    </button>

                    <h2
                    class="text-xl font-semibold mb-6 text-gray-900 dark:text-gray-100"
                    x-text="mode === 'create' ? 'Neuen Record hinzufügen' : 'Record bearbeiten'"
                    ></h2>

                    <form
                    :action="mode === 'create'
                        ? `/domains/{{ .DomainID }}/records/new`
                        : `/records/${record.id}/edit`"
                    method="POST"
                    class="space-y-4"
                    >

                    <!-- Name -->
                    <input
                        type="text"
                        name="name"
                        x-model="record.name"
                        placeholder="Record Name"
                        required
                        class="w-full px-4 py-3 rounded-lg
                            bg-white dark:bg-slate-800
                            text-gray-900 dark:text-gray-100
                            border border-gray-300 dark:border-slate-600
                            focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                    <!-- TYPE (DDL FIXED) -->
                    <select
                        name="type"
                        x-model="record.type"
                        class="w-full px-4 py-3 rounded-lg
                            bg-white dark:bg-slate-800
                            text-gray-900 dark:text-gray-100
                            border border-gray-300 dark:border-slate-600
                            focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        <option class="bg-white dark:bg-slate-800">A</option>
                        <option class="bg-white dark:bg-slate-800">AAAA</option>
                        <option class="bg-white dark:bg-slate-800">CNAME</option>
                        <option class="bg-white dark:bg-slate-800">MX</option>
                        <option class="bg-white dark:bg-slate-800">TXT</option>
                    </select>

                    <!-- Content -->
                    <textarea
                        name="content"
                        x-model="record.content"
                        rows="3"
                        placeholder="Content"
                        class="w-full px-4 py-3 rounded-lg
                            bg-white dark:bg-slate-800
                            text-gray-900 dark:text-gray-100
                            border border-gray-300 dark:border-slate-600
                            focus:outline-none focus:ring-2 focus:ring-blue-500"
                    ></textarea>

                    <!-- TTL -->
                    <input
                        type="number"
                        name="ttl"
                        x-model="record.ttl"
                        placeholder="TTL (seconds)"
                        class="w-full px-4 py-3 rounded-lg
                            bg-white dark:bg-slate-800
                            text-gray-900 dark:text-gray-100
                            border border-gray-300 dark:border-slate-600
                            focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                    <!-- Submit -->
                    <button
                        type="submit"
                        :disabled="!record.name || !record.content"
                        class="w-full bg-blue-600 hover:bg-blue-700
                            disabled:opacity-50 text-white py-3 rounded-lg"
                    >
                        Speichern
                    </button>

                    </form>
                </div>
                </div>


            <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
        </div>
    </div>
</div>
{{end}}

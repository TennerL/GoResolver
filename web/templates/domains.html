{{ define "content" }}

<div x-data="{ open: false }" x-cloak>

<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6">
  <div>
    <h3 class="text-xl font-semibold">Domains</h3>
    <p class="text-sm text-gray-500 dark:text-gray-400">
      Manage Domains and DNS records
    </p>
  </div>

  <div class="mt-4 sm:mt-0 flex gap-3">
    <button @click="open = true"
      class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
      + Neue Domain
    </button>
  </div>
</div>

{{ $items := .Data }}

<div class="bg-white dark:bg-slate-900 rounded-2xl shadow-md overflow-hidden">

  <table class="w-full text-sm">
    <thead class="bg-gray-50 dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700">
      <tr class="text-left text-gray-500 dark:text-gray-400">
        <th class="px-6 py-3 font-medium">ID</th>
        <th class="px-6 py-3 font-medium">Domain</th>
        <th class="px-6 py-3 font-medium">Actions</th>
        <th class="px-6 py-3 font-medium text-center">Status</th>
      </tr>
    </thead>

<tbody class="divide-y divide-gray-200 dark:divide-slate-700">
  {{ range $items }}
  <tr class="hover:bg-gray-50 dark:hover:bg-slate-800 transition">
    <td class="px-6 py-4 text-gray-400">{{ .ID }}</td>

    <td class="px-6 py-4 font-medium">
      {{ .Name }}
    </td>

    <td class="px-6 py-4">
      <div class="flex gap-4">
        <a href="/domains/{{ .ID }}/records"
           class="text-red-600 dark:text-red-400 font-medium hover:underline">
          Records
        </a>
        <form method="POST"
              action="/domains/{{ .ID }}/delete"
              onsubmit="return confirm('Delete this domain?')">
          <button class="text-gray-500 dark:text-gray-400 hover:text-red-600 transition">
            Delete
          </button>
        </form>
      </div>
    </td>

    <td class="px-6 py-4 text-center">
      <span
        class="inline-block w-3 h-3 rounded-full"
        :class="{
          'bg-green-500': '{{.Status}}' === 'Online',
          'bg-red-500': '{{.Status}}' === 'Offline'
        }"
      ></span>
    </td>
  </tr>
  {{ end }}
</tbody>

  </table>
</div>

<div
  x-show="open"
  x-cloak
  class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50"
>
  <div class="bg-white dark:bg-slate-900 rounded-xl shadow-xl w-96 p-8 relative">
    <button @click="open = false"
      class="absolute top-2 right-2 text-gray-500 dark:text-gray-400 hover:text-gray-800">
      &times;
    </button>

    <h2 class="text-2xl font-semibold mb-4">Neue Domain hinzufügen</h2>

    <form method="POST" action="/domains/new" class="space-y-4">
      <input type="text" name="name" placeholder="Domainname"
        class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600
               rounded-lg bg-white dark:bg-slate-800"
        required>
      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">
        Speichern
      </button>
    </form>
  </div>
</div>

<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</div>
{{ end }}

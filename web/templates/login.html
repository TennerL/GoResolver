{{ define "content" }}

<div class="flex flex-col items-center justify-center min-h-screen">

  <div class="bg-white dark:bg-slate-900 rounded-xl shadow-xl w-96 p-8 relative">
    <h2 class="text-2xl font-semibold text-center mb-6">Login</h2>

    {{ with .Data }}
      {{ if index . "Error" }}
        <p class="text-red-500 text-center mb-4">{{ index . "Error" }}</p>
      {{ end }}
    {{ end }}

    <form method="POST" action="/login" class="space-y-4">
      <input type="text" name="username" placeholder="Username"
        class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600
               rounded-lg bg-white dark:bg-slate-800" required>
      <input type="password" name="password" placeholder="Password"
        class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600
               rounded-lg bg-white dark:bg-slate-800" required>

      <button class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg">
        Login
      </button>
    </form>
  </div>

</div>

{{ end }}
